[package]
name = "task-ledger"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ledger"
path = "src/main.rs"

[[bin]]
name = "ldg"
path = "src/bin/ldg.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
jsonschema = "0.58"
predicates = "3"
